<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<style>
  :root {
    --sidebar-bg:   #141414;
    --main-bg:      #1a1a1a;
    --hover:        #232323;
    --active:       #2b2b2b;
    --border:       #2a2a2a;
    --text:         #ececec;
    --text-muted:   #8e8ea0;
    --text-dim:     #6b6b7b;
    --accent:       #5b8cff;
    --user-bubble:  #2b2b2b;
    --tool-border:  #2a4a3e;
    --tool-bg:      #0f1e1a;
    --tool-text:    #7ee0b8;
    --error-bg:     #2a1115;
    --error-text:   #ff8b9a;
    --error-border: #ef4455;
    --recording:    #f43f5e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--main-bg);
    color: var(--text);
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 14px;
    height: 100%;
    overflow: hidden;
  }
  .layout { display: flex; height: 100vh; width: 100vw; }

  /* Sidebar */
  .sidebar {
    width: 260px; flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: margin-left 0.25s ease;
  }
  .sidebar.collapsed { margin-left: -260px; }
  .sidebar-header { padding: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px; font-weight: 600; font-size: 15px; }
  .brand-logo {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    border-radius: 8px; background: linear-gradient(135deg, #5b8cff, #8b5bff); font-size: 15px;
  }
  .new-chat-btn {
    margin: 4px 12px 12px; padding: 10px 14px;
    background: transparent; border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; gap: 10px;
  }
  .new-chat-btn:hover { background: var(--hover); }
  .new-chat-btn .plus { font-size: 16px; color: var(--text-muted); }
  .session-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .session-list::-webkit-scrollbar { width: 6px; }
  .session-list::-webkit-scrollbar-thumb { background: #303030; border-radius: 3px; }
  .session-label {
    padding: 8px 8px 6px; font-size: 11px; font-weight: 600;
    color: var(--text-dim); letter-spacing: 0.04em; text-transform: uppercase;
  }
  .session-item {
    display: flex; align-items: center; padding: 8px 10px;
    margin-bottom: 2px; border-radius: 8px; cursor: pointer; font-size: 13px;
    transition: background 0.1s;
  }
  .session-item:hover { background: var(--hover); }
  .session-item.active { background: var(--active); }
  .session-title {
    flex: 1; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; padding-right: 6px;
  }
  .session-delete {
    width: 20px; height: 20px; display: none;
    align-items: center; justify-content: center; border-radius: 4px;
    background: transparent; border: none; color: var(--text-muted);
    font-size: 14px; cursor: pointer; flex-shrink: 0;
  }
  .session-item:hover .session-delete { display: flex; }
  .session-delete:hover { background: rgba(239, 68, 68, 0.15); color: #ff8b9a; }
  .sidebar-footer {
    padding: 12px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-muted);
    display: flex; align-items: center; gap: 8px;
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex-shrink: 0; }
  .status-dot.busy { background: #fbbf24; animation: pulse-dot 1s infinite; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--main-bg); }
  .main-header {
    height: 56px; flex-shrink: 0; padding: 0 20px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid transparent; transition: border-color 0.15s;
  }
  .main-header.scrolled { border-bottom-color: var(--border); }
  .hamburger {
    display: none; background: transparent; border: none; color: var(--text);
    font-size: 20px; cursor: pointer; padding: 6px 8px; border-radius: 6px;
  }
  .hamburger:hover { background: var(--hover); }
  .header-title {
    font-size: 14px; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1; min-width: 0;
  }

  /* Messages */
  .messages { flex: 1; overflow-y: auto; }
  .messages::-webkit-scrollbar { width: 10px; }
  .messages::-webkit-scrollbar-thumb { background: #303030; border-radius: 5px; border: 2px solid var(--main-bg); }
  .messages-inner {
    max-width: 768px; margin: 0 auto; padding: 24px 24px 120px;
    display: flex; flex-direction: column; gap: 22px;
  }
  .message { display: flex; flex-direction: column; animation: fade-in 0.2s ease; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .message.user { align-items: flex-end; }
  .message.user .bubble {
    background: var(--user-bubble); padding: 11px 16px; border-radius: 18px;
    max-width: 85%; white-space: pre-wrap; word-wrap: break-word;
    line-height: 1.5; font-size: 14px;
  }
  .message.assistant { align-items: flex-start; }
  .message.assistant .bubble {
    max-width: 100%; line-height: 1.65; font-size: 14.5px;
    word-wrap: break-word; overflow-wrap: break-word;
  }
  .bubble p { margin: 0.7em 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0.6em 0; padding-left: 1.5em; }
  .bubble li { margin: 0.3em 0; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
    margin: 1.1em 0 0.5em; font-weight: 600; line-height: 1.3; color: #fff;
  }
  .bubble h1 { font-size: 1.4em; }
  .bubble h2 { font-size: 1.2em; }
  .bubble h3 { font-size: 1.05em; }
  .bubble a { color: #7aa2ff; text-decoration: none; }
  .bubble a:hover { text-decoration: underline; }
  .bubble code:not(pre code) {
    background: #0f0f0f; padding: 2px 6px; border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.88em; color: #e2c4ff; border: 1px solid #2a2a2a;
  }
  .bubble pre {
    background: #0d0d0d; padding: 14px 16px; border-radius: 10px;
    overflow-x: auto; margin: 0.8em 0; border: 1px solid #232323;
  }
  .bubble pre code {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 13px; line-height: 1.55; background: none; padding: 0;
    border: none; color: inherit;
  }
  .bubble blockquote { margin: 0.7em 0; padding: 4px 14px; border-left: 3px solid #404040; color: var(--text-muted); }
  .bubble table { border-collapse: collapse; margin: 0.7em 0; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; }
  .bubble th { background: #232323; }
  .bubble img { max-width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid var(--border); cursor: pointer; display: block; }

  .tool-chip {
    margin-top: 10px; padding: 10px 14px; background: var(--tool-bg);
    border: 1px solid var(--tool-border); border-left: 3px solid var(--tool-text);
    border-radius: 8px; font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 12px; color: var(--tool-text); max-width: 100%;
  }
  .tool-chip .name { font-weight: 600; }
  .tool-chip .preview {
    color: #6ba88d; margin-top: 5px; font-size: 11.5px;
    white-space: pre-wrap; word-break: break-word; line-height: 1.5;
  }
  .error-card {
    margin-top: 10px; padding: 12px 16px; background: var(--error-bg);
    border-left: 3px solid var(--error-border); border-radius: 8px;
    color: var(--error-text); font-size: 13px; white-space: pre-wrap;
    word-break: break-word; font-family: ui-monospace, Consolas, monospace; line-height: 1.5;
  }
  .thinking { display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; }
  .thinking span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: dot-bounce 1.4s infinite ease-in-out; }
  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dot-bounce { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  /* Empty state */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 40px 24px; text-align: center; }
  .empty-logo {
    width: 60px; height: 60px; border-radius: 16px;
    background: linear-gradient(135deg, #5b8cff, #8b5bff);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(91, 140, 255, 0.15);
  }
  .empty-title { font-size: 26px; font-weight: 600; margin: 0 0 10px; color: #fff; }
  .empty-sub { color: var(--text-muted); font-size: 14.5px; margin: 0 0 34px; max-width: 420px; line-height: 1.5; }
  .suggestions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 600px; width: 100%; }
  .suggestion {
    padding: 14px 16px; background: #202020; border: 1px solid var(--border);
    border-radius: 12px; text-align: left; cursor: pointer; transition: all 0.15s;
    font-family: inherit; color: var(--text); font-size: 13.5px; line-height: 1.4;
  }
  .suggestion:hover { background: #262626; border-color: #3a3a3a; transform: translateY(-1px); }
  .suggestion .icon { font-size: 18px; margin-bottom: 6px; display: block; }
  .suggestion .label { color: var(--text-muted); font-size: 11.5px; margin-top: 4px; }

  /* Input */
  .input-area { flex-shrink: 0; padding: 12px 24px 20px; background: var(--main-bg); }
  .input-area-inner { max-width: 768px; margin: 0 auto; }
  .input-box {
    display: flex; align-items: flex-end; gap: 6px; background: #202020;
    border: 1px solid var(--border); border-radius: 16px;
    padding: 8px 8px 8px 14px; transition: border-color 0.15s;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
  }
  .input-box:focus-within { border-color: #3a3a3a; }
  textarea#input {
    flex: 1; resize: none; background: transparent; border: none;
    color: var(--text); font-family: inherit; font-size: 14.5px; line-height: 1.5;
    padding: 8px 4px; outline: none; max-height: 200px; min-height: 22px;
  }
  textarea#input::placeholder { color: var(--text-dim); }
  .icon-btn {
    width: 34px; height: 34px; border: none; background: transparent;
    color: var(--text-muted); border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; transition: all 0.12s;
  }
  .icon-btn:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .icon-btn.send { background: var(--accent); color: #fff; }
  .icon-btn.send:hover:not(:disabled) { background: #6b95ff; }
  .icon-btn.send:disabled { background: #2a2a2a; color: var(--text-dim); }
  .icon-btn.mic.recording { background: var(--recording); color: #fff; animation: mic-pulse 1.2s infinite; }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.5); }
    50%      { box-shadow: 0 0 0 8px rgba(244, 63, 94, 0); }
  }
  .input-hint { font-size: 11.5px; color: var(--text-dim); text-align: center; margin-top: 8px; }

  @media (max-width: 768px) {
    .sidebar { position: fixed; z-index: 100; height: 100vh; box-shadow: 4px 0 24px rgba(0,0,0,0.4); }
    .hamburger { display: flex; }
    .messages-inner { padding: 16px 16px 100px; }
    .input-area { padding: 10px 12px 16px; }
    .suggestions { grid-template-columns: 1fr; }
    .message.user .bubble { max-width: 90%; }
  }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; opacity: 0; transition: opacity 0.25s; }
  .overlay.visible { display: block; opacity: 1; }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-logo">🤖</div>
        <div>Super Agent</div>
      </div>
    </div>
    <button class="new-chat-btn" id="newChatBtn">
      <span class="plus">+</span>
      <span>New chat</span>
    </button>
    <div class="session-list" id="sessionList"></div>
    <div class="sidebar-footer">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">ready</span>
    </div>
  </aside>

  <main class="main">
    <header class="main-header" id="mainHeader">
      <button class="hamburger" id="hamburger">☰</button>
      <div class="header-title" id="headerTitle">New chat</div>
    </header>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="input-area-inner">
        <div class="input-box">
          <button class="icon-btn mic" id="micBtn" title="Voice input">🎤</button>
          <textarea id="input" placeholder="Message Super Agent..." rows="1"></textarea>
          <button class="icon-btn send" id="sendBtn" title="Send" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
        <div class="input-hint">Super Agent may make mistakes. Verify important info.</div>
      </div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════════
const state = {
  sessionId: null,
  busy: false,
  sessions: [],
};

// ═══════════════════════════════════════════════════════════
//  DOM
// ═══════════════════════════════════════════════════════════
const $ = (id) => document.getElementById(id);
const sidebarEl     = $('sidebar');
const overlayEl     = $('overlay');
const sessionListEl = $('sessionList');
const messagesEl    = $('messages');
const inputEl       = $('input');
const sendBtn       = $('sendBtn');
const micBtn        = $('micBtn');
const newChatBtn    = $('newChatBtn');
const hamburger     = $('hamburger');
const headerTitle   = $('headerTitle');
const statusDot     = $('statusDot');
const statusText    = $('statusText');
const mainHeader    = $('mainHeader');

// ═══════════════════════════════════════════════════════════
//  Marked
// ═══════════════════════════════════════════════════════════
marked.setOptions({
  breaks: true,
  gfm: true,
  highlight: function(code, lang) {
    try {
      if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
      return hljs.highlightAuto(code).value;
    } catch (e) { return code; }
  }
});

// ═══════════════════════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════════════════════
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setStatus(text, busy = false) {
  statusText.textContent = text;
  statusDot.classList.toggle('busy', busy);
}
function scrollToBottom(smooth = true) {
  messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
}
function nearBottom() {
  return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;
}
function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
}
function updateSendBtn() {
  sendBtn.disabled = state.busy || !inputEl.value.trim();
}

// ═══════════════════════════════════════════════════════════
//  Empty state
// ═══════════════════════════════════════════════════════════
function renderEmptyState() {
  messagesEl.innerHTML = `
    <div class="empty-state">
      <div class="empty-logo">🤖</div>
      <h1 class="empty-title">How can I help you today?</h1>
      <p class="empty-sub">Ask anything. I can search the web, write code, generate images, watch videos, and remember things.</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="Search the web for the latest AI news">
          <span class="icon">🌐</span>Search the web<div class="label">for the latest AI news</div>
        </button>
        <button class="suggestion" data-prompt="Write a Python function that parses JSON safely">
          <span class="icon">💻</span>Write code<div class="label">a safe JSON parser in Python</div>
        </button>
        <button class="suggestion" data-prompt="Generate an image of a cyberpunk city at night">
          <span class="icon">🎨</span>Generate an image<div class="label">cyberpunk city at night</div>
        </button>
        <button class="suggestion" data-prompt="Explain how transformers work in simple terms">
          <span class="icon">🧠</span>Explain a concept<div class="label">how transformers work</div>
        </button>
      </div>
    </div>
  `;
  messagesEl.querySelectorAll('.suggestion').forEach(btn => {
    btn.onclick = () => {
      inputEl.value = btn.dataset.prompt || '';
      autoResize();
      updateSendBtn();
      inputEl.focus();
    };
  });
}

// ═══════════════════════════════════════════════════════════
//  Sidebar sessions
// ═══════════════════════════════════════════════════════════
function renderSessions() {
  sessionListEl.innerHTML = '';
  if (state.sessions.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'padding: 20px 12px; color: var(--text-dim); font-size: 12px; text-align: center;';
    empty.textContent = 'No conversations yet';
    sessionListEl.appendChild(empty);
    return;
  }
  const label = document.createElement('div');
  label.className = 'session-label';
  label.textContent = 'Recent';
  sessionListEl.appendChild(label);

  for (const s of state.sessions) {
    const item = document.createElement('div');
    item.className = 'session-item';
    if (s.id === state.sessionId) item.classList.add('active');

    const title = document.createElement('div');
    title.className = 'session-title';
    title.textContent = s.title || 'New chat';
    item.appendChild(title);

    const del = document.createElement('button');
    del.className = 'session-delete';
    del.textContent = '×';
    del.onclick = (e) => { e.stopPropagation(); deleteSession(s.id); };
    item.appendChild(del);

    item.onclick = () => {
      if (state.busy) return;
      if (state.sessionId === s.id) { closeSidebarMobile(); return; }
      loadSession(s.id);
      closeSidebarMobile();
    };
    sessionListEl.appendChild(item);
  }
}

async function refreshSessions() {
  try {
    const res = await fetch('/sessions');
    const data = await res.json();
    state.sessions = data.sessions || [];
    renderSessions();
  } catch (e) { console.error('refreshSessions:', e); }
}

async function deleteSession(sid) {
  if (!confirm('Delete this chat?')) return;
  await fetch('/sessions/' + sid, { method: 'DELETE' });
  if (state.sessionId === sid) newChat();
  await refreshSessions();
}

async function loadSession(sid) {
  try {
    const res = await fetch('/sessions/' + sid);
    if (!res.ok) return;
    const data = await res.json();
    state.sessionId = sid;
    headerTitle.textContent = data.title || 'Chat';
    messagesEl.innerHTML = '';
    for (const m of data.messages) {
      if (m.role === 'user') addUserMessage(m.content);
      else if (m.role === 'assistant') {
        const b = addAssistantBubble();
        renderMarkdown(b, m.content);
      }
    }
    renderSessions();
    scrollToBottom(false);
  } catch (e) { console.error(e); }
}

// ═══════════════════════════════════════════════════════════
//  Message rendering
// ═══════════════════════════════════════════════════════════
function clearEmptyStateIfPresent() {
  const empty = messagesEl.querySelector('.empty-state');
  if (empty) messagesEl.innerHTML = '';
}

function addUserMessage(text) {
  clearEmptyStateIfPresent();
  const wrap = document.createElement('div');
  wrap.className = 'message user';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  scrollToBottom();
}

function addAssistantBubble() {
  const wrap = document.createElement('div');
  wrap.className = 'message assistant';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  return bubble;
}

function renderMarkdown(bubble, text) {
  const imgRegex = /(?:ai_creations[\/\\]|(?:\/files\/))([^\s\)\]]+\.(?:png|jpg|jpeg|gif|webp))/gi;
  const images = [];
  const clean = text.replace(imgRegex, (m, filename) => { images.push(filename); return ''; });

  try {
    bubble.innerHTML = marked.parse(clean);
  } catch (e) {
    bubble.textContent = clean;
  }

  for (const filename of images) {
    const img = document.createElement('img');
    img.src = '/files/' + filename;
    img.alt = filename;
    img.onclick = () => window.open(img.src, '_blank');
    img.onerror = () => { img.style.display = 'none'; };
    bubble.appendChild(img);
  }
  bubble.querySelectorAll('pre code:not(.hljs)').forEach(el => {
    try { hljs.highlightElement(el); } catch (e) {}
  });
}

function addToolChip(id, name, args) {
  clearEmptyStateIfPresent();
  const wrap = document.createElement('div');
  wrap.className = 'message assistant';
  const chip = document.createElement('div');
  chip.className = 'tool-chip';
  chip.dataset.toolId = id;
  const argList = Object.entries(args || {})
    .map(([k, v]) => `${k}=${JSON.stringify(v).slice(0, 60)}`)
    .join(', ');
  chip.innerHTML = `<div>🛠️ <span class="name">${escapeHtml(name)}</span>(${escapeHtml(argList)})</div>`;
  wrap.appendChild(chip);
  messagesEl.appendChild(wrap);
  scrollToBottom();
}

function updateToolChip(id, preview) {
  const chip = messagesEl.querySelector(`[data-tool-id="${id}"]`);
  if (!chip) return;
  const div = document.createElement('div');
  div.className = 'preview';
  div.textContent = '↳ ' + preview;
  chip.appendChild(div);
  scrollToBottom();
}

function addErrorCard(text) {
  clearEmptyStateIfPresent();
  const wrap = document.createElement('div');
  wrap.className = 'message assistant';
  const err = document.createElement('div');
  err.className = 'error-card';
  err.textContent = '❌ ' + text;
  wrap.appendChild(err);
  messagesEl.appendChild(wrap);
  scrollToBottom();
}

// ═══════════════════════════════════════════════════════════
//  Send + streaming
// ═══════════════════════════════════════════════════════════
async function send() {
  const text = inputEl.value.trim();
  if (!text || state.busy) return;

  inputEl.value = '';
  autoResize();
  state.busy = true;
  updateSendBtn();
  setStatus('thinking...', true);

  addUserMessage(text);

  let currentBubble = null;
  let currentText = '';

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ message: text, session_id: state.sessionId }),
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        const line = raw.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;

        let ev;
        try { ev = JSON.parse(line.slice(6)); } catch { continue; }

        switch (ev.type) {
          case 'session': {
            if (state.sessionId !== ev.session_id) {
              state.sessionId = ev.session_id;
              await refreshSessions();
              const meta = state.sessions.find(s => s.id === ev.session_id);
              headerTitle.textContent = meta ? meta.title : 'Chat';
            }
            break;
          }

          case 'token': {
            if (!currentBubble) {
              currentBubble = addAssistantBubble();
              currentText = '';
            }
            currentText += ev.text;
            renderMarkdown(currentBubble, currentText);
            if (nearBottom()) scrollToBottom(false);
            break;
          }

          case 'tool_call': {
            // If we had a partial text bubble, that's done. Reset for next.
            if (currentBubble && !currentBubble.textContent.trim()) {
              currentBubble.parentElement.remove();
            }
            currentBubble = null;
            currentText = '';
            addToolChip(ev.id, ev.name, ev.args);
            break;
          }

          case 'tool_result':
            updateToolChip(ev.id, ev.preview);
            break;

          case 'error':
            if (currentBubble && !currentBubble.textContent.trim()) {
              currentBubble.parentElement.remove();
            }
            currentBubble = null;
            addErrorCard(ev.message);
            break;

          case 'max_steps':
            addErrorCard('Reached max tool steps without a final answer.');
            break;

          case 'done':
            break;
        }
      }
    }
  } catch (err) {
    addErrorCard(String(err));
  } finally {
    state.busy = false;
    updateSendBtn();
    setStatus('ready', false);
    inputEl.focus();
    await refreshSessions();
  }
}

// ═══════════════════════════════════════════════════════════
//  New chat / sidebar toggling
// ═══════════════════════════════════════════════════════════
function newChat() {
  if (state.busy) return;
  state.sessionId = null;
  headerTitle.textContent = 'New chat';
  renderEmptyState();
  renderSessions();
  inputEl.focus();
}
function openSidebarMobile() {
  sidebarEl.classList.remove('collapsed');
  overlayEl.classList.add('visible');
}
function closeSidebarMobile() {
  if (window.innerWidth <= 768) {
    sidebarEl.classList.add('collapsed');
    overlayEl.classList.remove('visible');
  }
}

// ═══════════════════════════════════════════════════════════
//  Voice (Web Speech API)
// ═══════════════════════════════════════════════════════════
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  micBtn.disabled = true;
  micBtn.title = 'Voice not supported (use Chrome/Edge)';
} else {
  const recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  let recording = false;
  let baseText = '';
  let finalText = '';

  recognition.onstart = () => {
    recording = true;
    micBtn.classList.add('recording');
    setStatus('listening...', true);
    baseText = inputEl.value;
    finalText = '';
  };
  recognition.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t + ' ';
      else interim += t;
    }
    inputEl.value = (baseText ? baseText + ' ' : '') + finalText + interim;
    autoResize(); updateSendBtn();
  };
  recognition.onerror = (e) => {
    if (e.error === 'not-allowed') {
      setStatus('mic blocked', false);
      setTimeout(() => setStatus('ready', false), 2000);
    }
  };
  recognition.onend = () => {
    recording = false;
    micBtn.classList.remove('recording');
    setStatus('ready', false);
    inputEl.focus();
  };
  micBtn.onclick = () => { if (recording) recognition.stop(); else recognition.start(); };
}

// ═══════════════════════════════════════════════════════════
//  Wiring
// ═══════════════════════════════════════════════════════════
sendBtn.onclick = send;

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', () => { autoResize(); updateSendBtn(); });

newChatBtn.onclick = () => { newChat(); closeSidebarMobile(); };
hamburger.onclick = () => {
  sidebarEl.classList.toggle('collapsed');
  overlayEl.classList.toggle('visible', !sidebarEl.classList.contains('collapsed'));
};
overlayEl.onclick = () => {
  sidebarEl.classList.add('collapsed');
  overlayEl.classList.remove('visible');
};
messagesEl.addEventListener('scroll', () => {
  mainHeader.classList.toggle('scrolled', messagesEl.scrollTop > 10);
});

// ═══════════════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════════════
(async function init() {
  if (window.innerWidth <= 768) sidebarEl.classList.add('collapsed');
  renderEmptyState();
  await refreshSessions();
  updateSendBtn();
  inputEl.focus();
})();
</script>
